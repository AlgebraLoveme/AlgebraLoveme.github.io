<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Dividing April's input square by the phase of an unstable ReLU</title>
  <desc id="desc">The diagonal x1 equals x2 divides the input square into a blue off phase where z2 is nonpositive and h2 equals zero, and an orange on phase where z2 is nonnegative and h2 equals z2.</desc>
  <rect width="1000" height="480" fill="#ffffff"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#111827">
    <text x="220" y="38" text-anchor="middle" font-size="23" font-weight="600">Divide at z₂ = 0</text>
    <text x="750" y="38" text-anchor="middle" font-size="23" font-weight="600">Conquer two linear phases</text>
  </g>

  <!-- Input square and diagonal phase boundary. -->
  <polygon points="70,90 370,90 70,390" fill="#e7f1fb"/>
  <polygon points="70,390 370,90 370,390" fill="#fff0e8"/>
  <rect x="70" y="90" width="300" height="300" fill="none" stroke="#374151" stroke-width="3"/>
  <line x1="70" y1="390" x2="370" y2="90" stroke="#7c6bb3" stroke-width="4" stroke-dasharray="10 7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="155" y="165" font-size="24" font-weight="600" fill="#17365d">R<tspan baseline-shift="sub" font-size="16">off</tspan></text>
    <text x="155" y="197" font-size="18" fill="#17365d">x₁ ≤ x₂</text>
    <text x="285" y="315" font-size="24" font-weight="600" fill="#6b241f">R<tspan baseline-shift="sub" font-size="16">on</tspan></text>
    <text x="285" y="347" font-size="18" fill="#6b241f">x₁ ≥ x₂</text>
    <text x="220" y="72" font-size="17" fill="#35246f">branch boundary: x₁ = x₂</text>
    <text x="70" y="416" font-size="15" fill="#252a34">0.26</text>
    <text x="370" y="416" font-size="15" fill="#252a34">0.74</text>
    <text x="220" y="444" font-size="18" fill="#111827">x₁</text>
  </g>
  <text x="42" y="245" text-anchor="middle" transform="rotate(-90 42 245)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#111827">x₂</text>
  <text x="58" y="392" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#252a34">0.26</text>
  <text x="58" y="96" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#252a34">0.74</text>

  <!-- Arrows from the two phase regions. -->
  <g fill="none" stroke-width="4">
    <path d="M 265 130 C 430 90, 470 118, 550 148" stroke="#2f6fad"/>
    <path d="M 330 350 C 430 400, 480 365, 550 330" stroke="#b9473e"/>
  </g>
  <path d="M 537 138 L 552 149 L 534 152" fill="none" stroke="#2f6fad" stroke-width="4"/>
  <path d="M 536 327 L 552 330 L 540 342" fill="none" stroke="#b9473e" stroke-width="4"/>

  <!-- Exact phase cards. -->
  <rect x="550" y="82" width="390" height="145" rx="14" fill="#e7f1fb" stroke="#2f6fad" stroke-width="3"/>
  <rect x="550" y="263" width="390" height="145" rx="14" fill="#fff0e8" stroke="#b9473e" stroke-width="3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="745" y="120" font-size="22" font-weight="600" fill="#17365d">Off phase</text>
    <text x="745" y="158" font-size="21" fill="#111827">z₂ ≤ 0  ⇒  h₂ = 0</text>
    <text x="745" y="195" font-size="17" fill="#17365d">the flat ReLU branch is exact</text>

    <text x="745" y="301" font-size="22" font-weight="600" fill="#6b241f">On phase</text>
    <text x="745" y="339" font-size="21" fill="#111827">z₂ ≥ 0  ⇒  h₂ = z₂</text>
    <text x="745" y="376" font-size="17" fill="#6b241f">the diagonal ReLU branch is exact</text>
  </g>
</svg>
