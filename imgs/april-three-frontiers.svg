<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Three frontiers in neural network certification</title>
  <desc id="desc">Three cards connect the questions exist, find, and prove to interval universal approximation, the certified training paradox, and multi-neuron expressiveness.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b7088"/></marker>
  </defs>
  <rect width="1000" height="360" fill="#fff"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="650" fill="#111827">What limits a certified neural network?</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <line x1="318" y1="178" x2="352" y2="178" stroke="#5b7088" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="648" y1="178" x2="682" y2="178" stroke="#5b7088" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="32" y="76" width="282" height="220" rx="18" fill="#e5e0ef" stroke="#59449b" stroke-width="2.5"/>
      <circle cx="173" cy="122" r="28" fill="#59449b"/>
      <text x="173" y="131" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">1</text>
      <text x="173" y="171" text-anchor="middle" font-size="25" font-weight="700" fill="#3f3271">EXIST</text>
      <text x="173" y="204" text-anchor="middle" font-size="17" fill="#252a34">Can the desired network</text>
      <text x="173" y="228" text-anchor="middle" font-size="17" fill="#252a34">and certificate exist?</text>
      <rect x="71" y="251" width="204" height="29" rx="14" fill="#c5b9dd"/>
      <text x="173" y="271" text-anchor="middle" font-size="15" font-weight="600" fill="#3f3271">Interval universality</text>
    </g>
    <g>
      <rect x="358" y="76" width="282" height="220" rx="18" fill="#dceeeB" stroke="#3b8587" stroke-width="2.5"/>
      <circle cx="499" cy="122" r="28" fill="#3b8587"/>
      <text x="499" y="131" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">2</text>
      <text x="499" y="171" text-anchor="middle" font-size="25" font-weight="700" fill="#296668">FIND</text>
      <text x="499" y="204" text-anchor="middle" font-size="17" fill="#252a34">Can gradient-based</text>
      <text x="499" y="228" text-anchor="middle" font-size="17" fill="#252a34">training reach it?</text>
      <rect x="394" y="251" width="210" height="29" rx="14" fill="#a6d3d0"/>
      <text x="499" y="271" text-anchor="middle" font-size="15" font-weight="600" fill="#295f61">Training paradox</text>
    </g>
    <g>
      <rect x="686" y="76" width="282" height="220" rx="18" fill="#f5e5bf" stroke="#b9822f" stroke-width="2.5"/>
      <circle cx="827" cy="122" r="28" fill="#b9822f"/>
      <text x="827" y="131" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">3</text>
      <text x="827" y="171" text-anchor="middle" font-size="25" font-weight="700" fill="#805a21">PROVE</text>
      <text x="827" y="204" text-anchor="middle" font-size="17" fill="#252a34">Can the verifier retain</text>
      <text x="827" y="228" text-anchor="middle" font-size="17" fill="#252a34">the needed relationships?</text>
      <rect x="720" y="251" width="214" height="29" rx="14" fill="#e9c67f"/>
      <text x="827" y="271" text-anchor="middle" font-size="15" font-weight="600" fill="#76511f">Joint relaxations</text>
    </g>
  </g>
</svg>
