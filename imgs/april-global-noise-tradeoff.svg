<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">One global randomized smoothing noise level creates a trade-off</title>
  <desc id="desc">A small noise cloud preserves local accuracy and a large cloud reaches farther. Two April inputs prefer different noise levels, while standard smoothing chooses one global sigma.</desc>
  <rect width="1000" height="500" fill="#fff"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="650" fill="#111827">Different inputs can prefer different noise levels</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="48" y="75" width="410" height="340" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="253" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#1f437e">Clear April photograph</text>
    <circle cx="250" cy="250" r="55" fill="#cee5ef" stroke="#2f5da8" stroke-width="3" stroke-dasharray="7 6"/>
    <circle cx="250" cy="250" r="13" fill="#111827"/>
    <g fill="#2f5da8"><circle cx="222" cy="221" r="6"/><circle cx="282" cy="229" r="6"/><circle cx="266" cy="274" r="6"/><circle cx="215" cy="265" r="6"/><circle cx="248" cy="206" r="6"/></g>
    <text x="250" y="339" text-anchor="middle" font-size="18" font-weight="650" fill="#1f437e">small σ keeps pA high</text>
    <text x="250" y="368" text-anchor="middle" font-size="16" fill="#5b6470">strong at smaller radii</text>

    <rect x="542" y="75" width="410" height="340" rx="16" fill="#fbf8ff" stroke="#c9b8e8" stroke-width="2"/>
    <text x="747" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#49397f">Another April photograph</text>
    <circle cx="744" cy="250" r="116" fill="#e5e0ef" stroke="#59449b" stroke-width="3" stroke-dasharray="9 7"/>
    <circle cx="744" cy="250" r="13" fill="#111827"/>
    <g fill="#59449b"><circle cx="680" cy="194" r="6"/><circle cx="815" cy="190" r="6"/><circle cx="803" cy="282" r="6"/><circle cx="672" cy="302" r="6"/><circle cx="744" cy="156" r="6"/><circle cx="850" cy="246" r="6"/><circle cx="718" cy="340" r="6"/></g>
    <text x="744" y="395" text-anchor="middle" font-size="18" font-weight="650" fill="#49397f">large σ multiplies a wider radius</text>

    <rect x="260" y="443" width="480" height="39" rx="18" fill="#f5e5bf" stroke="#b9822f" stroke-width="2"/>
    <text x="500" y="469" text-anchor="middle" font-size="17" font-weight="650" fill="#76511f">standard RS must choose one global σ for both</text>
  </g>
</svg>
