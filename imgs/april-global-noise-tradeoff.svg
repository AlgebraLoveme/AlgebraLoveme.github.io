<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Different inputs maximize certified radius at different noise scales</title>
  <desc id="desc">Two schematic certified-radius curves share the same sigma axis and peak at different values. The solid curve for a fragile input peaks at a small sigma. The dashed curve for an input stable under stronger perturbations peaks at a larger sigma. One global sigma cannot maximize both.</desc>
  <rect width="1000" height="520" fill="#fff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="650" fill="#111827">Each input has its own best noise scale</text>
    <rect x="62" y="78" width="876" height="340" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="132" y1="362" x2="880" y2="362" stroke="#374151" stroke-width="2.5"/>
    <line x1="132" y1="362" x2="132" y2="122" stroke="#374151" stroke-width="2.5"/>
    <text x="506" y="402" text-anchor="middle" font-size="17" fill="#374151">noise scale σ</text>
    <text x="94" y="242" text-anchor="middle" transform="rotate(-90 94 242)" font-size="17" fill="#374151">certified radius R(σ)</text>
    <path d="M132 340 C205 310 252 190 338 172 C455 160 560 254 690 319 C770 350 838 354 880 350" fill="none" stroke="#2f5da8" stroke-width="5"/>
    <path d="M132 350 C265 344 390 316 520 230 C620 165 690 140 748 154 C820 173 858 278 880 340" fill="none" stroke="#59449b" stroke-width="5" stroke-dasharray="12 8"/>
    <line x1="338" y1="172" x2="338" y2="362" stroke="#2f5da8" stroke-width="2" stroke-dasharray="7 6"/>
    <line x1="748" y1="154" x2="748" y2="362" stroke="#59449b" stroke-width="2" stroke-dasharray="7 6"/>
    <circle cx="338" cy="172" r="8" fill="#2f5da8"/><circle cx="748" cy="154" r="8" fill="#59449b"/>
    <text x="300" y="140" text-anchor="end" font-size="18" font-weight="700" fill="#1f437e">fragile input · solid</text>
    <text x="300" y="163" text-anchor="end" font-size="15" fill="#1f437e">best at smaller σ</text>
    <text x="910" y="124" text-anchor="end" font-size="18" font-weight="700" fill="#49397f">stable input · dashed</text>
    <text x="910" y="147" text-anchor="end" font-size="15" fill="#49397f">best at larger σ</text>
    <text x="338" y="388" text-anchor="middle" font-size="15" fill="#1f437e">σ<tspan baseline-shift="sub" font-size="11">small</tspan></text>
    <text x="748" y="388" text-anchor="middle" font-size="15" fill="#49397f">σ<tspan baseline-shift="sub" font-size="11">large</tspan></text>
    <rect x="250" y="447" width="500" height="45" rx="20" fill="#f5e5bf" stroke="#b9822f" stroke-width="2"/>
    <text x="500" y="476" text-anchor="middle" font-size="17" font-weight="650" fill="#3f2706">standard smoothing uses one global σ for every input</text>
  </g>
</svg>
