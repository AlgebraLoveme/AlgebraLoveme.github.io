<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Pointwise and interval approximation of April's cat score</title>
  <desc id="desc">A smooth target score and nearby piecewise-linear network are plotted against image brightness. Three input intervals map to true score ranges and slightly wider IBP-certified ranges.</desc>
  <rect width="1000" height="540" fill="#fff"/>
  <text x="500" y="36" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="650" fill="#111827">The network must approximate points and ranges</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="74" y="72" width="852" height="386" rx="12" fill="#fbfcfe" stroke="#d5dce5" stroke-width="2"/>
    <line x1="120" y1="420" x2="892" y2="420" stroke="#252a34" stroke-width="2.5"/>
    <line x1="120" y1="420" x2="120" y2="104" stroke="#252a34" stroke-width="2.5"/>
    <text x="506" y="497" text-anchor="middle" font-size="17" fill="#374151">brightness summary t</text>
    <text x="42" y="262" text-anchor="middle" transform="rotate(-90 42 262)" font-size="17" fill="#374151">April cat score</text>

    <g opacity="0.95">
      <rect x="190" y="330" width="128" height="68" fill="#c5b9dd" fill-opacity="0.48" stroke="#59449b" stroke-width="2"/>
      <rect x="195" y="338" width="118" height="51" fill="#8fc3dc" fill-opacity="0.48" stroke="#2f5da8" stroke-width="2"/>
      <rect x="435" y="221" width="130" height="94" fill="#c5b9dd" fill-opacity="0.48" stroke="#59449b" stroke-width="2"/>
      <rect x="440" y="231" width="120" height="73" fill="#8fc3dc" fill-opacity="0.48" stroke="#2f5da8" stroke-width="2"/>
      <rect x="690" y="147" width="126" height="71" fill="#c5b9dd" fill-opacity="0.48" stroke="#59449b" stroke-width="2"/>
      <rect x="695" y="156" width="116" height="53" fill="#8fc3dc" fill-opacity="0.48" stroke="#2f5da8" stroke-width="2"/>
    </g>

    <path d="M120 382 C205 376 242 343 310 330 C385 316 407 270 482 255 C552 241 585 277 646 224 C714 164 772 178 892 126" fill="none" stroke="#111827" stroke-width="4"/>
    <polyline points="120,386 205,371 290,337 375,312 460,261 545,247 630,230 715,175 800,168 892,130" fill="none" stroke="#b9473e" stroke-width="3.5" stroke-dasharray="10 7"/>

    <g font-size="16">
      <line x1="624" y1="112" x2="671" y2="112" stroke="#111827" stroke-width="4"/>
      <text x="682" y="118" fill="#111827">continuous target</text>
      <line x1="624" y1="137" x2="671" y2="137" stroke="#b9473e" stroke-width="3.5" stroke-dasharray="9 6"/>
      <text x="682" y="143" fill="#7e322c">ReLU network</text>
      <rect x="158" y="94" width="20" height="14" fill="#8fc3dc" fill-opacity="0.6" stroke="#2f5da8"/>
      <text x="188" y="107" fill="#2f5da8">true output range</text>
      <rect x="158" y="119" width="20" height="14" fill="#c5b9dd" fill-opacity="0.6" stroke="#59449b"/>
      <text x="188" y="132" fill="#59449b">IBP range</text>
    </g>

    <g stroke="#7a858c" stroke-width="1.5" stroke-dasharray="5 5">
      <line x1="190" y1="420" x2="190" y2="330"/><line x1="318" y1="420" x2="318" y2="330"/>
      <line x1="435" y1="420" x2="435" y2="221"/><line x1="565" y1="420" x2="565" y2="221"/>
      <line x1="690" y1="420" x2="690" y2="147"/><line x1="816" y1="420" x2="816" y2="147"/>
    </g>
    <text x="254" y="448" text-anchor="middle" font-size="15" fill="#5b6470">input interval B₁</text>
    <text x="500" y="448" text-anchor="middle" font-size="15" fill="#5b6470">input interval B₂</text>
    <text x="753" y="448" text-anchor="middle" font-size="15" fill="#5b6470">input interval B₃</text>
  </g>
</svg>
