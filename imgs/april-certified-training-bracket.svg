<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Training losses around April's exact worst-case loss</title>
  <desc id="desc">For April's current classifier, the clean loss is 0.403, an attack reaches the exact worst-case loss of 0.589, DeepPoly gives a sound upper loss of 0.703, and IBP gives a sound upper loss of 0.832. An unsound training proxy can lie on either side of the exact worst-case loss.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="650" fill="#111827">One target, training signals from both sides</text>

  <!-- Sound ordering panel. -->
  <rect x="35" y="70" width="625" height="450" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="347" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#111827">April's current classifier</text>

  <line x1="105" y1="466" x2="105" y2="135" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="74" y="300" transform="rotate(-90 74 300)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#374151">larger loss</text>

  <!-- Guide lines. -->
  <g stroke="#d8dee8" stroke-width="1.5">
    <line x1="125" y1="438" x2="625" y2="438"/>
    <line x1="125" y1="326" x2="625" y2="326"/>
    <line x1="125" y1="238" x2="625" y2="238"/>
    <line x1="125" y1="150" x2="625" y2="150"/>
  </g>

  <!-- Clean loss. -->
  <circle cx="190" cy="438" r="9" fill="#6b7280"/>
  <text x="215" y="431" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#374151">Clean example</text>
  <text x="215" y="454" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#4b5563">loss 0.403</text>

  <!-- Attack and exact worst case coincide in the teaching example. -->
  <circle cx="190" cy="326" r="10" fill="#d97706"/>
  <text x="215" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#9a5b08">Attack point</text>
  <text x="215" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#9a5b08">loss 0.589</text>

  <line x1="345" y1="326" x2="420" y2="326" stroke="#7c6bb3" stroke-width="3"/>
  <path d="M 430 314 L 442 326 L 430 338 L 418 326 z" fill="#7c6bb3"/>
  <text x="462" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#5b4a91">Exact worst case</text>
  <text x="462" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#5b4a91">loss 0.589</text>
  <text x="382" y="357" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#6b7280">equal for this tiny network</text>

  <!-- Certified upper losses. -->
  <rect x="176" y="225" width="18" height="26" rx="3" fill="#2f855a"/>
  <text x="215" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#276749">Sound DeepPoly upper loss</text>
  <text x="215" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#376b50">0.703</text>

  <rect x="176" y="137" width="18" height="26" rx="3" fill="#23804d"/>
  <text x="215" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#1f7045">Sound IBP upper loss</text>
  <text x="215" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#376b50">0.832</text>

  <path d="M 590 320 L 610 320 L 610 156 L 590 156" fill="none" stroke="#23804d" stroke-width="3"/>
  <text x="585" y="192" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#1f7045">guaranteed</text>
  <text x="585" y="212" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#1f7045">upper side</text>

  <!-- Unsound proxy panel. -->
  <rect x="690" y="70" width="275" height="450" rx="16" fill="#fbf8ff" stroke="#c9b8e8" stroke-width="2"/>
  <text x="827" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#4d3b78">Unsound training proxy</text>
  <text x="827" y="133" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#65558f">no guaranteed ordering</text>

  <line x1="730" y1="326" x2="925" y2="326" stroke="#7c6bb3" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="827" y="316" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#5b4a91">exact worst-case loss</text>

  <line x1="827" y1="190" x2="827" y2="438" stroke="#8066b3" stroke-width="3" stroke-dasharray="7 6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <circle cx="827" cy="225" r="9" fill="#a78bda"/>
  <text x="847" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#5b4a91">could be above</text>
  <circle cx="827" cy="405" r="9" fill="#a78bda"/>
  <text x="847" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#5b4a91">could be below</text>

  <rect x="722" y="458" width="210" height="42" rx="9" fill="#efe8fb"/>
  <text x="827" y="484" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#4d3b78">useful for learning, proof deferred</text>
</svg>
