<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Dual randomized smoothing certifies routing and classification</title>
  <desc id="desc">The input enters both a smoothed scale estimator and a classifier. The estimator selects sigma 0.5 and certifies routing radius R sigma, then controls the classifier's noise scale. The classifier predicts Siberian cat and certifies radius R c. The final radius is the minimum.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b7088"/></marker></defs>
  <rect width="1120" height="560" fill="#fff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <circle cx="84" cy="244" r="42" fill="#cee5ef" stroke="#2f5da8" stroke-width="3"/><text x="84" y="239" text-anchor="middle" font-size="16" font-weight="650" fill="#1f437e">April</text><text x="84" y="260" text-anchor="middle" font-size="15" fill="#1f437e">input x</text>
    <line x1="130" y1="244" x2="184" y2="244" stroke="#5b7088" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M130 228 H166 V48 H797 V75" fill="none" stroke="#5b7088" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="470" y="38" text-anchor="middle" font-size="15" fill="#405368">input x also enters the classifier</text>

    <rect x="198" y="82" width="346" height="328" rx="18" fill="#fbf8ff" stroke="#59449b" stroke-width="2.5"/>
    <text x="371" y="111" text-anchor="middle" font-size="21" font-weight="700" fill="#49397f"><tspan x="371">1. Smoothed variance</tspan><tspan x="371" dy="24">estimator</tspan></text>
    <text x="371" y="165" text-anchor="middle" font-size="16" fill="#65558f">Which noise level should x use?</text>
    <g><rect x="244" y="185" width="78" height="45" rx="10" fill="#e5e0ef"/><text x="283" y="214" text-anchor="middle" font-size="17" fill="#49397f">0.25</text><rect x="332" y="178" width="78" height="59" rx="10" fill="#59449b"/><text x="371" y="214" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">0.5</text><rect x="420" y="185" width="78" height="45" rx="10" fill="#e5e0ef"/><text x="459" y="214" text-anchor="middle" font-size="17" fill="#49397f">1.0</text></g>
    <text x="371" y="275" text-anchor="middle" font-size="19" font-weight="700" fill="#49397f">select σ = 0.5</text>
    <rect x="246" y="305" width="250" height="66" rx="12" fill="#c5b9dd"/>
    <text x="371" y="332" text-anchor="middle" font-size="16" fill="#3f3271">routing certificate</text><text x="371" y="358" text-anchor="middle" font-size="21" font-weight="700" fill="#3f3271">radius R<tspan baseline-shift="sub" font-size="15">σ</tspan></text>

    <line x1="556" y1="244" x2="610" y2="244" stroke="#5b7088" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="583" y="226" text-anchor="middle" font-size="14" fill="#405368">selected σ</text>
    <rect x="624" y="82" width="346" height="328" rx="18" fill="#f2f8f1" stroke="#347a45" stroke-width="2.5"/>
    <text x="797" y="111" text-anchor="middle" font-size="21" font-weight="700" fill="#286437"><tspan x="797">2. Classifier smoothed</tspan><tspan x="797" dy="24">at σ = 0.5</tspan></text>
    <text x="797" y="165" text-anchor="middle" font-size="16" fill="#376b50">Which class wins the noisy vote?</text>
    <rect x="681" y="185" width="232" height="76" rx="14" fill="#b4d7af"/>
    <text x="797" y="216" text-anchor="middle" font-size="17" fill="#164e2a">prediction</text><text x="797" y="244" text-anchor="middle" font-size="22" font-weight="700" fill="#164e2a">Siberian cat</text>
    <rect x="672" y="305" width="250" height="66" rx="12" fill="#b4d7af"/>
    <text x="797" y="332" text-anchor="middle" font-size="16" fill="#164e2a">classification certificate</text><text x="797" y="358" text-anchor="middle" font-size="21" font-weight="700" fill="#164e2a">radius R<tspan baseline-shift="sub" font-size="15">c</tspan></text>

    <path d="M371 420 V459 H797 V420" fill="none" stroke="#5b7088" stroke-width="3"/>
    <line x1="584" y1="459" x2="584" y2="484" stroke="#5b7088" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="394" y="493" width="380" height="50" rx="14" fill="#f5e5bf" stroke="#b9822f" stroke-width="2.5"/>
    <text x="584" y="525" text-anchor="middle" font-size="21" font-weight="700" fill="#76511f">final radius R = min(R<tspan baseline-shift="sub" font-size="15">σ</tspan>, R<tspan baseline-shift="sub" font-size="15">c</tspan>)</text>
  </g>
</svg>
