<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Layerwise, cross-layer, and whole-network convexification windows</title>
  <desc id="desc">Five network layers are shown three times. A layerwise relaxation places a separate convex-hull window around each layer. A cross-three-layer relaxation uses three overlapping windows over layers one to three, two to four, and three to five. A whole-network relaxation places one window around all five layers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b7088"/>
    </marker>
  </defs>

  <rect width="1000" height="650" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="500" y="34" text-anchor="middle" font-size="25" font-weight="650" fill="#111827">Cross-layer relaxations use overlapping windows</text>
    <text x="500" y="59" text-anchor="middle" font-size="15" fill="#4b5563">Each colored enclosure marks one jointly convexified part of the network.</text>

    <!-- Panel backgrounds. -->
    <rect x="28" y="78" width="944" height="140" rx="16" fill="#f4f8fd" stroke="#8fc3dc" stroke-width="2"/>
    <rect x="28" y="236" width="944" height="260" rx="16" fill="#f8f5fc" stroke="#c5b9dd" stroke-width="2"/>
    <rect x="28" y="514" width="944" height="112" rx="16" fill="#f2faf8" stroke="#a6d3d0" stroke-width="2"/>

    <!-- Left-side row labels. -->
    <text x="54" y="112" font-size="21" font-weight="650" fill="#244c89">Layerwise</text>
    <text x="54" y="138" font-size="17" font-weight="650" fill="#244c89">r = 1</text>
    <text x="54" y="174" font-size="15" fill="#374151">One hull</text>
    <text x="54" y="194" font-size="15" fill="#374151">per layer</text>

    <text x="54" y="270" font-size="21" font-weight="650" fill="#49397f">Cross-layer</text>
    <text x="54" y="296" font-size="17" font-weight="650" fill="#49397f">r = 3</text>
    <text x="54" y="332" font-size="15" fill="#374151">Each hull spans</text>
    <text x="54" y="352" font-size="15" fill="#374151">three layers</text>

    <text x="54" y="548" font-size="21" font-weight="650" fill="#286b6d">Whole network</text>
    <text x="54" y="574" font-size="17" font-weight="650" fill="#286b6d">r = L = 5</text>
    <text x="54" y="605" font-size="15" fill="#374151">One global hull</text>

    <!-- Layerwise row: five separate windows. -->
    <g text-anchor="middle">
      <g fill="#ffffff" stroke="#2f5da8" stroke-width="2">
        <rect x="270" y="116" width="100" height="54" rx="10"/>
        <rect x="400" y="116" width="100" height="54" rx="10"/>
        <rect x="530" y="116" width="100" height="54" rx="10"/>
        <rect x="660" y="116" width="100" height="54" rx="10"/>
        <rect x="790" y="116" width="100" height="54" rx="10"/>
      </g>
      <g font-size="16" font-weight="650" fill="#111827">
        <text x="320" y="149">Layer 1</text>
        <text x="450" y="149">Layer 2</text>
        <text x="580" y="149">Layer 3</text>
        <text x="710" y="149">Layer 4</text>
        <text x="840" y="149">Layer 5</text>
      </g>
    </g>
    <g stroke="#5b7088" stroke-width="2.5" marker-end="url(#arrow)">
      <line x1="372" y1="143" x2="393" y2="143"/>
      <line x1="502" y1="143" x2="523" y2="143"/>
      <line x1="632" y1="143" x2="653" y2="143"/>
      <line x1="762" y1="143" x2="783" y2="143"/>
    </g>

    <!-- Cross-layer row: the same chain plus all three sliding windows. -->
    <g text-anchor="middle">
      <g fill="#ffffff" stroke="#7a858c" stroke-width="1.8">
        <rect x="270" y="258" width="100" height="48" rx="9"/>
        <rect x="400" y="258" width="100" height="48" rx="9"/>
        <rect x="530" y="258" width="100" height="48" rx="9"/>
        <rect x="660" y="258" width="100" height="48" rx="9"/>
        <rect x="790" y="258" width="100" height="48" rx="9"/>
      </g>
      <g font-size="15" font-weight="650" fill="#111827">
        <text x="320" y="288">Layer 1</text>
        <text x="450" y="288">Layer 2</text>
        <text x="580" y="288">Layer 3</text>
        <text x="710" y="288">Layer 4</text>
        <text x="840" y="288">Layer 5</text>
      </g>
    </g>
    <g stroke="#5b7088" stroke-width="2.3" marker-end="url(#arrow)">
      <line x1="372" y1="282" x2="393" y2="282"/>
      <line x1="502" y1="282" x2="523" y2="282"/>
      <line x1="632" y1="282" x2="653" y2="282"/>
      <line x1="762" y1="282" x2="783" y2="282"/>
    </g>

    <g font-size="15" font-weight="650">
      <text x="238" y="342" text-anchor="end" fill="#49397f">Window 1</text>
      <rect x="270" y="320" width="360" height="32" rx="9" fill="#e5e0ef" stroke="#59449b" stroke-width="2"/>
      <text x="450" y="342" text-anchor="middle" fill="#49397f">layers 1–3</text>

      <text x="238" y="386" text-anchor="end" fill="#49397f">Window 2</text>
      <rect x="400" y="364" width="360" height="32" rx="9" fill="#e5e0ef" stroke="#59449b" stroke-width="2"/>
      <text x="580" y="386" text-anchor="middle" fill="#49397f">layers 2–4</text>

      <text x="238" y="430" text-anchor="end" fill="#49397f">Window 3</text>
      <rect x="530" y="408" width="360" height="32" rx="9" fill="#e5e0ef" stroke="#59449b" stroke-width="2"/>
      <text x="710" y="430" text-anchor="middle" fill="#49397f">layers 3–5</text>
    </g>
    <text x="580" y="470" text-anchor="middle" font-size="15" fill="#374151">Neighboring windows overlap and share intermediate variables.</text>

    <!-- Whole-network row: one enclosure around every layer. -->
    <rect x="252" y="532" width="656" height="66" rx="13" fill="#dceeed" stroke="#3b8587" stroke-width="2.5"/>
    <g text-anchor="middle">
      <g fill="#ffffff" stroke="#3b8587" stroke-width="1.8">
        <rect x="270" y="541" width="100" height="48" rx="9"/>
        <rect x="400" y="541" width="100" height="48" rx="9"/>
        <rect x="530" y="541" width="100" height="48" rx="9"/>
        <rect x="660" y="541" width="100" height="48" rx="9"/>
        <rect x="790" y="541" width="100" height="48" rx="9"/>
      </g>
      <g font-size="15" font-weight="650" fill="#111827">
        <text x="320" y="571">Layer 1</text>
        <text x="450" y="571">Layer 2</text>
        <text x="580" y="571">Layer 3</text>
        <text x="710" y="571">Layer 4</text>
        <text x="840" y="571">Layer 5</text>
      </g>
    </g>
    <g stroke="#5b7088" stroke-width="2.3" marker-end="url(#arrow)">
      <line x1="372" y1="565" x2="393" y2="565"/>
      <line x1="502" y1="565" x2="523" y2="565"/>
      <line x1="632" y1="565" x2="653" y2="565"/>
      <line x1="762" y1="565" x2="783" y2="565"/>
    </g>
  </g>
</svg>
