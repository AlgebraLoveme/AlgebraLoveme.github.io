<svg xmlns="http://www.w3.org/2000/svg" width="520" height="810" viewBox="0 0 520 810" role="img" aria-labelledby="title desc">
<title id="title">Add another task without waiting</title>
<desc id="desc">Illustrative conversation. A user requests dataset-loader fixes. While that worker runs, the user asks for CSV export without saying meanwhile or continue. PIRA keeps both assignments active, with independent loader and exporter workers.</desc>
<rect width="520" height="810" rx="16" fill="#f5faf8"/>
<g font-family="Arial, sans-serif" fill="#162d32">
<text x="260" y="37" text-anchor="middle" font-size="25" font-weight="700">Add another task without waiting</text>
<rect x="24" y="62" width="472" height="160" rx="12" fill="#fff" stroke="#b5c9c7"/>
<text x="46" y="95" font-size="22" font-weight="700">You · first request</text>
<text x="46" y="130" font-size="23">Review the dataset loader.</text>
<text x="46" y="162" font-size="23">Fix confirmed bugs; preserve</text>
<text x="46" y="194" font-size="23">supported input formats.</text>
<rect x="40" y="241" width="440" height="38" rx="19" fill="#dceee8"/>
<text x="260" y="267" text-anchor="middle" font-size="21" fill="#162d32">Loader worker: still running</text>
<rect x="24" y="299" width="472" height="160" rx="12" fill="#fff" stroke="#b5c9c7"/>
<text x="46" y="332" font-size="22" font-weight="700">You · next message</text>
<text x="46" y="367" font-size="23">Add CSV export using the existing</text>
<text x="46" y="399" font-size="23">record format. Include a small</text>
<text x="46" y="431" font-size="23">round-trip check.</text>
<rect x="24" y="485" width="472" height="94" rx="12" fill="#235c58"/>
<text x="46" y="519" font-size="22" font-weight="700" fill="#fff">PIRA</text>
<text x="46" y="552" font-size="23" fill="#fff">Both assignments remain active.</text>
<text x="260" y="626" text-anchor="middle" font-size="22" font-weight="700">Independent work runs in parallel</text>
<rect x="24" y="648" width="228" height="116" rx="12" fill="#e4eef4" stroke="#8ba9bb"/>
<rect x="268" y="648" width="228" height="116" rx="12" fill="#e4eef4" stroke="#8ba9bb"/>
<text x="138" y="690" text-anchor="middle" font-size="23" font-weight="700">Loader worker</text>
<text x="138" y="727" text-anchor="middle" font-size="22">Review and fix</text>
<text x="382" y="690" text-anchor="middle" font-size="23" font-weight="700">Export worker</text>
<text x="382" y="727" text-anchor="middle" font-size="22">Build and test</text>
</g></svg>
