<svg xmlns="http://www.w3.org/2000/svg" width="640" height="964" viewBox="0 0 640 964" role="img" aria-labelledby="title desc">
  <title id="title">PIRA Team: one main agent, local and remote execution</title>
  <desc id="desc">You talk only to the main agent. It chooses local or remote execution for each worker or whole authorized subteam. This example shows a local ordinary worker and a remote subteam with one coordinator and two ordinary child workers. The coordinator assigns child tasks, integrates results, and reports to the main. Each subteam stays entirely on its selected machine. Ordinary workers cannot delegate. Solid downward arrows show assignments. Dashed upward arrows show results and decision requests returning through the assigning parent. Machine boundaries show execution location, without implying workspace synchronization.</desc>
  <rect width="640" height="964" rx="16" fill="#f5faf8"/>
  <g font-family="Arial, sans-serif" fill="#162d32" text-anchor="middle">
    <rect x="170" y="24" width="300" height="70" rx="12" fill="#fff" stroke="#b5c9c7"/>
    <text x="320" y="54" font-size="26" font-weight="700">You</text>
    <text x="320" y="82" font-size="26">Goals + decisions</text>

    <rect x="60" y="144" width="520" height="124" rx="12" fill="#235c58"/>
    <g fill="#fff">
      <text x="320" y="182" font-size="26" font-weight="700">Main agent</text>
      <text x="320" y="218" font-size="26">Chooses local or remote execution</text>
      <text x="320" y="250" font-size="26">Coordinates work + decisions</text>
    </g>

    <rect x="24" y="320" width="246" height="472" rx="12" fill="#fafafb" stroke="#b5c9c7" stroke-width="2"/>
    <rect x="286" y="320" width="330" height="472" rx="12" fill="#fafafb" stroke="#b5c9c7" stroke-width="2"/>
    <text x="44" y="357" text-anchor="start" font-size="26" font-weight="700">Local machine</text>
    <text x="306" y="357" text-anchor="start" font-size="26" font-weight="700">Remote machine</text>

    <rect x="40" y="452" width="214" height="122" rx="12" fill="#e4eef4" stroke="#8ba9bb"/>
    <text x="147" y="490" font-size="26">Worker</text>
    <text x="147" y="526" font-size="26">Bounded task</text>
    <text x="147" y="558" font-size="26">Handoff to main</text>

    <rect x="300" y="382" width="302" height="392" rx="12" fill="#fff" stroke="#b5c9c7"/>
    <text x="312" y="408" text-anchor="start" font-size="26" font-weight="700">Authorized</text>
    <text x="312" y="439" text-anchor="start" font-size="26" font-weight="700">subteam</text>
    <rect x="308" y="452" width="286" height="122" rx="12" fill="#dceee8" stroke="#8caeaa"/>
    <text x="451" y="490" font-size="26">Coordinator</text>
    <text x="451" y="526" font-size="26">Assigns + integrates</text>
    <text x="451" y="558" font-size="26">Handoff to main</text>

    <rect x="308" y="670" width="132" height="82" rx="12" fill="#e4eef4" stroke="#8ba9bb"/>
    <rect x="462" y="670" width="132" height="82" rx="12" fill="#e4eef4" stroke="#8ba9bb"/>
    <text x="374" y="704" font-size="26">Worker 1</text>
    <text x="374" y="736" font-size="26">Ordinary</text>
    <text x="528" y="704" font-size="26">Worker 2</text>
    <text x="528" y="736" font-size="26">Ordinary</text>

    <text x="320" y="830" font-size="26">Ordinary workers do not delegate.</text>
    <text x="320" y="867" font-size="26">Each subteam stays on one machine.</text>
  </g>
  <g fill="none" stroke-width="2.5">
    <g stroke="#235c58">
      <path d="M308 96V142"/>
      <path d="M228 270V450"/>
      <path d="M548 270V450"/>
      <path d="M366 576V668"/>
      <path d="M520 576V668"/>
      <path d="M82 890V916"/>
    </g>
    <g stroke="#365e78" stroke-dasharray="5 4">
      <path d="M332 142V96"/>
      <path d="M244 450V270"/>
      <path d="M564 450V270"/>
      <path d="M382 668V576"/>
      <path d="M536 668V576"/>
      <path d="M82 956V930"/>
    </g>
  </g>
  <g fill="#235c58">
    <path d="M299.25 127L308 144.5L316.75 127Z"/>
    <path d="M219.25 435L228 452.5L236.75 435Z"/>
    <path d="M539.25 435L548 452.5L556.75 435Z"/>
    <path d="M357.25 653L366 670.5L374.75 653Z"/>
    <path d="M511.25 653L520 670.5L528.75 653Z"/>
    <path d="M73.25 901L82 918.5L90.75 901Z"/>
  </g>
  <g fill="#365e78">
    <path d="M323.25 111L332 93.5L340.75 111Z"/>
    <path d="M235.25 285L244 267.5L252.75 285Z"/>
    <path d="M555.25 285L564 267.5L572.75 285Z"/>
    <path d="M373.25 591L382 573.5L390.75 591Z"/>
