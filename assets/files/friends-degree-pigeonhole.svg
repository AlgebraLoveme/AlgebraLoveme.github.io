<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title description">
  <title id="title">Why two people must have the same number of friends</title>
  <desc id="description">Two five-vertex graphs show that a vertex of degree zero rules out degree four, while a vertex of degree four rules out degree zero. Five vertices therefore share only four possible degree values.</desc>

  <defs>
    <style>
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .heading { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .node-label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
      .edge { stroke: #64748b; stroke-width: 3; stroke-linecap: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="490" rx="18" fill="#f8fafc"/>
  <text class="title" x="480" y="37" text-anchor="middle">The two extreme degrees cannot occur together</text>

  <rect x="30" y="60" width="435" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="heading" x="247.5" y="89" text-anchor="middle">Case 1: degree 0 occurs</text>

  <line class="edge" x1="237" y1="130" x2="357" y2="130"/>
  <line class="edge" x1="357" y1="130" x2="357" y2="235"/>
  <line class="edge" x1="357" y1="235" x2="237" y2="235"/>

  <circle cx="98" cy="182" r="25" fill="#fef2f2" stroke="#dc2626" stroke-width="4"/>
  <text class="node-label" x="98" y="182" fill="#991b1b">A</text>
  <text class="small" x="98" y="222" text-anchor="middle" fill="#991b1b">degree 0</text>

  <circle cx="237" cy="130" r="21" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text class="node-label" x="237" y="130" fill="#0f172a">B</text>
  <circle cx="357" cy="130" r="21" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text class="node-label" x="357" y="130" fill="#0f172a">C</text>
  <circle cx="237" cy="235" r="21" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text class="node-label" x="237" y="235" fill="#0f172a">D</text>
  <circle cx="357" cy="235" r="21" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text class="node-label" x="357" y="235" fill="#0f172a">E</text>

  <text class="body" x="247.5" y="283" text-anchor="middle">Nobody can be connected to everyone.</text>
  <text class="heading" x="247.5" y="308" text-anchor="middle" fill="#1d4ed8">Possible degrees: 0, 1, 2, 3</text>

  <rect x="495" y="60" width="435" height="265" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="heading" x="712.5" y="89" text-anchor="middle">Case 2: degree 4 occurs</text>

  <line class="edge" x1="712" y1="182" x2="575" y2="125"/>
  <line class="edge" x1="712" y1="182" x2="850" y2="125"/>
  <line class="edge" x1="712" y1="182" x2="575" y2="240"/>
  <line class="edge" x1="712" y1="182" x2="850" y2="240"/>

  <circle cx="712" cy="182" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text class="node-label" x="712" y="182" fill="#1e3a8a">B</text>
  <text class="small" x="712" y="224" text-anchor="middle" fill="#1e3a8a">degree 4</text>

  <circle cx="575" cy="125" r="21" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text class="node-label" x="575" y="125" fill="#0f172a">A</text>
  <circle cx="850" cy="125" r="21" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text class="node-label" x="850" y="125" fill="#0f172a">C</text>
  <circle cx="575" cy="240" r="21" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text class="node-label" x="575" y="240" fill="#0f172a">D</text>
  <circle cx="850" cy="240" r="21" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text class="node-label" x="850" y="240" fill="#0f172a">E</text>

  <text class="body" x="712.5" y="283" text-anchor="middle">Everyone has at least one connection.</text>
  <text class="heading" x="712.5" y="308" text-anchor="middle" fill="#1d4ed8">Possible degrees: 1, 2, 3, 4</text>

  <rect x="30" y="345" width="900" height="95" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="heading" x="255" y="378" text-anchor="middle">5 vertices</text>
  <circle cx="171" cy="408" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="213" cy="408" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="255" cy="408" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="297" cy="408" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="339" cy="408" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

  <line x1="375" y1="400" x2="495" y2="400" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="heading" x="690" y="378" text-anchor="middle">4 possible degree values</text>
  <rect x="565" y="394" width="52" height="29" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="635" y="394" width="52" height="29" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="705" y="394" width="52" height="29" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="775" y="394" width="52" height="29" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

  <text class="body" x="480" y="460" text-anchor="middle" font-weight="700">By the pigeonhole principle, two vertices must have the same degree.</text>
</svg>
